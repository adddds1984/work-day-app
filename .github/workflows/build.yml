name: flutter-build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'

      - name: Set pub mirror
        run: |
          export PUB_HOSTED_URL=https://pub.flutter-io.cn
          export FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn
          echo "PUB_HOSTED_URL=$PUB_HOSTED_URL" >> $GITHUB_ENV
          echo "FLUTTER_STORAGE_BASE_URL=$FLUTTER_STORAGE_BASE_URL" >> $GITHUB_ENV

      - name: Get dependencies
        run: flutter pub get
        timeout-minutes: 10

      - name: Create Flutter Android project
        run: flutter create . --platforms=android --org=com.example --project-name=work_day_app
        timeout-minutes: 5

      - name: Build APK
        run: flutter build apk --release
        timeout-minutes: 15

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
