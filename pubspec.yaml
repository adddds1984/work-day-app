name: work_day_app
description: 离线记工日APP - 简洁高效的工地工日记录工具
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  # 本地存储
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # 状态管理
  provider: ^6.1.1
  # UUID生成
  uuid: ^4.3.3
  # 日历组件
  table_calendar: ^3.1.2
  # 日期格式化工具
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
